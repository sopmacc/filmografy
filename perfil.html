<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filmography - Meu Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-filmo" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="home.html">Filmography</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="filmes.html">Filmes</a></li>
            <li class="nav-item"><a class="nav-link" href="filmesH.html">Em alta no momento</a></li>
            <li class="nav-item"><a class="nav-link" href="debates.html">Debates</a></li>
            <li class="nav-item"><a class="nav-link" href="reviews.html">Reviews</a></li>
          </ul>
          <form class="d-flex me-3" role="search" id="searchForm">
            <input class="form-control me-2 rounded-3" type="search" placeholder="Buscar..." aria-label="Search" id="searchInput"/>
            <button class="btn btn-filmo rounded-3" type="submit">Buscar</button>
          </form>
          <a href="perfil.html" class="d-flex align-items-center text-light text-decoration-none border-start border-secondary ps-3 ms-2">
            <i class="bi bi-person-circle fs-4 me-2" style="color: var(--filmo-accent);"></i>
            <span class="fw-semibold" style="font-size: 0.95rem;" id="nomeUsuarioNavbar">Usuário</span>
          </a>
        </div>
      </div>
    </nav>

    <div class="container my-5 flex-grow-1" style="max-width: 600px; min-height: 60vh;">
      <h2 class="text-white fw-bold mb-4 text-center" style="font-family: 'Tenor Sans', sans-serif;">Meu Perfil</h2>

      <div class="card border-0 shadow" style="background-color: #2c3440; border-radius: 12px;">
        <div class="card-body p-5">
          
          <form id="formPerfil">
            <div class="mb-4 text-center">
              <img id="previewFoto" src="https://via.placeholder.com/150/1b2228/00e054?text=Foto" alt="Sua Foto" class="mb-3" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--filmo-accent);">
            </div>

            <div class="mb-3">
              <label class="form-label text-light fw-semibold">Nome de Exibição</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="perfilNome" required>
            </div>

            <div class="mb-4">
              <label class="form-label text-light fw-semibold">URL da Foto de Perfil</label>
              <input type="url" class="form-control bg-dark text-white border-secondary" id="perfilFoto" placeholder="Cole o link de uma imagem (Opcional)">
              <small class="text-secondary mt-1 d-block">Cole um link direto para a imagem (ex: https://site.com/foto.jpg)</small>
            </div>

            <button type="submit" class="btn btn-filmo w-100 fw-bold py-2">Salvar Alterações</button>
          </form>

        </div>
      </div>
    </div>

    <footer class="text-center py-4 mt-auto shadow-sm" style="background-color: #1b2228; border-top: 2px solid var(--filmo-accent);">
      <div class="container">
        <h5 class="text-light mb-2 fw-bold" style="font-family: 'Tenor Sans', sans-serif;">Filmography</h5>
        <p class="text-secondary mb-0" style="font-size: 0.9rem;">
          Desenvolvido por: Pedro Campos Fagundes Teixeira<br>
          Projeto Acadêmico - 2026
        </p>
      </div>
    </footer>

    <script>
      const nomeSalvo = localStorage.getItem("usuarioLogado") || "";
      const fotoSalva = localStorage.getItem("fotoUsuario") || "";
      
      const inputNome = document.getElementById("perfilNome");
      const inputFoto = document.getElementById("perfilFoto");
      const previewFoto = document.getElementById("previewFoto");
      const elementoNavbar = document.getElementById("nomeUsuarioNavbar");

      inputNome.value = nomeSalvo;
      if (nomeSalvo && elementoNavbar) elementoNavbar.textContent = nomeSalvo;
      
      if (fotoSalva) {
        inputFoto.value = fotoSalva;
        previewFoto.src = fotoSalva;
      }

      inputFoto.addEventListener("input", function() {
        if(this.value) {
          previewFoto.src = this.value;
        } else {
          previewFoto.src = "https://via.placeholder.com/150/1b2228/00e054?text=Foto";
        }
      });

      document.getElementById("formPerfil").addEventListener("submit", function(e) {
        e.preventDefault();
        localStorage.setItem("usuarioLogado", inputNome.value.trim());
        localStorage.setItem("fotoUsuario", inputFoto.value.trim());
        
        alert("Perfil atualizado com sucesso!");
        
        // Redireciona para a página principal após salvar
        window.location.href = "home.html";
      });
    </script>
  </body>
</html>
