<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Filmography - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
  </head>
  
  <body data-bs-theme="dark" class="d-flex flex-column" style="min-height: 100vh;">

    <div class="container d-flex justify-content-center align-items-center flex-grow-1" style="padding-top: 5vh;">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        
        <div class="card shadow-lg border-0" style="background-color: #2c3440; border-radius: 16px;">
          <div class="card-body p-5">
            
            <h2 class="card-title text-center mb-4 fw-bold" style="color: var(--filmo-accent);">Filmography</h2>

            <form id="loginForm" novalidate>
              <div class="mb-4">
                <label for="nome" class="form-label text-light fw-semibold">Nome</label>
                <input type="text" class="form-control bg-dark border-secondary text-white py-2" id="nome" placeholder="Digite seu nome" required>
                <div class="invalid-feedback fw-semibold" id="nomeError"></div>
              </div>

              <div class="mb-4">
                <label for="senha" class="form-label text-light fw-semibold">Senha</label>
                <input type="password" class="form-control bg-dark border-secondary text-white py-2" id="senha" placeholder="Digite sua senha" required>
              </div>

              <button type="submit" class="btn btn-filmo w-100 py-2 mt-2 fw-bold" style="font-size: 1.1rem;">Entrar</button>
            </form>

            <p class="text-center text-secondary mt-4 mb-0" style="font-size: 0.8rem;">
              Este é um protótipo ilustrativo. Digite apenas um nome e uma senha qualquer.
            </p>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center py-4 mt-auto shadow-sm" style="background-color: #1b2228; border-top: 2px solid var(--filmo-accent);">
      <div class="container">
        <p class="text-secondary mb-0" style="font-size: 0.85rem;">
          Desenvolvido por: Pedro Campos Fagundes Teixeira<br>
          Projeto Acadêmico - 2026
        </p>
      </div>
    </footer>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-bg-dark border-secondary" style="border-radius: 12px;">
          <div class="modal-header border-secondary">
            <h5 class="modal-title fw-bold" id="loginModalLabel" style="color: var(--filmo-accent);">Login realizado</h5>
          </div>
          <div class="modal-body">
            <p class="mb-0 fs-5" id="loginModalMensagem">Login realizado com sucesso!</p>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-filmo fw-bold px-4" id="loginModalOk">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
      const palavrasBanidas = [
        "hitler",
        "nazista",
        "penis",
        "vagina",
        "buceta",
        "porra",
        "caralho",
        "puta",
        "viado",
        "negro de merda"
      ];

      function normalizar(texto) {
        return texto
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      const form = document.getElementById("loginForm");
      const nomeInput = document.getElementById("nome");
      const nomeError = document.getElementById("nomeError");

      const loginModalEl = document.getElementById("loginModal");
      const loginModal = new bootstrap.Modal(loginModalEl);
      const loginModalMensagem = document.getElementById("loginModalMensagem");
      const loginModalOk = document.getElementById("loginModalOk");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const nomeValor = normalizar(nomeInput.value.trim());
        const contemPalavraBanida = palavrasBanidas.some(function (palavra) {
          return nomeValor.includes(normalizar(palavra));
        });

        if (contemPalavraBanida) {
          nomeInput.classList.add("is-invalid");
          nomeError.textContent = "Esse nome contém uma palavra não permitida. Escolha outro.";
        } else if (nomeValor === "") {
          nomeInput.classList.add("is-invalid");
          nomeError.textContent = "Digite um nome.";
        } else {
          nomeInput.classList.remove("is-invalid");
          loginModalMensagem.textContent = "Login realizado com sucesso, " + nomeInput.value + "!";
          loginModal.show();
        }
      });

      // Salva o nome digitado no localStorage antes de ir para o index
      loginModalOk.addEventListener("click", function () {
        const nomeUsuario = nomeInput.value.trim();
        if (nomeUsuario) {
          localStorage.setItem("usuarioLogado", nomeUsuario);
        }
        window.location.href = "index.html";
      });
    </script>

  </body>
</html>
